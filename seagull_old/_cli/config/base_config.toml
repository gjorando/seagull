# Base configuration file for Seagull's CLI front-end.

[seagull.core]

url = ""

[seagull.generators.pages]

object-class = "Page"
valid-paths = ["pages"]
priority = "CONTENT-1"

[seagull.generators.assets]

instance-class = "AssetsGenerator"
valid-paths = ["images"]
priority = "ASSETS-1"

[seagull.generators.indexes]

instance-class = "IndexesGenerator"
valid-paths = ["indexes"]
default-indexes = ["Page", "Asset"]
priority = "POST_CONTENT-1"

[seagull.parsers.rest]

instance-class = "ReSTParser"

[seagull.parsers.html]

instance-class = "HTMLParser"
