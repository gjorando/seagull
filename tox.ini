[tox]
envlist = py{3.14},docs

[testenv]
basepython =
    py3.14: python3.14
passenv = *
usedevelop=True
deps =
    -rrequirements/test.pip

commands =
    {envpython} --version
    pytest -s --cov=seagull --cov-fail-under 75 seagull

[testenv:docs]
basepython = python3.14
deps =
    -rrequirements/docs.pip
changedir = docs
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . _build/html

[pytest]
filterwarnings =
    default::DeprecationWarning
    error:.*:Warning:seagull
addopts = -n auto -r a --import-mode=importlib
