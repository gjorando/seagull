{% extends "base.html" %}

{% block title %}{{ sitename|striptags }} - Authors{% endblock %}

{% block content %}
    <h2>Authors on {{ sitename }}</h2>
    <ul>
        {% for author in authors|sort %}
            <li><a href="{{ siteurl }}/{{ author.url }}">{{ author.name }}</a> ({{ author.articles|count }})</li>
        {% endfor %}
    </ul>
{% endblock %}
