{% extends "base.html" %}

{% block title %}{{ sitename|striptags }} - {{ _("Archives") }}{% endblock %}

{% block content %}
    <h2>{% trans trimmed %}Archives for {{ sitename }}{% endtrans %}</h2>

    <dl>
        {% for article in articles %}
            <dt>{{ article.locale_date }}</dt>
            <dd><a href="{{ siteurl }}/{{ article.url }}">{{ article.title }}</a></dd>
        {% endfor %}
    </dl>
{% endblock %}
