{% extends "base.html" %}

{% block title %}{{ sitename|striptags }} - Categories{% endblock %}

{% block content %}
    <h2>Categories on {{ sitename }}</h2>
    <ul>
        {% for category in categories|sort %}
            <li><a href="{{ siteurl }}/{{ category.url }}">{{ category.name }}</a> ({{ category.articles|count }})</li>
        {% endfor %}
    </ul>
{% endblock %}
