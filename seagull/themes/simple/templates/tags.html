{% extends "base.html" %}

{% block title %}{{ sitename|striptags }} - Tags{% endblock %}

{% block content %}
    <h2>Tags for {{ sitename }}</h2>
    <ul>
        {% for tag in tags|sort %}
            <li><a href="{{ siteurl }}/{{ tag.url }}">{{ tag }}</a> ({{ tag.articles|count }})</li>
        {% endfor %}
    </ul>
{% endblock %}
